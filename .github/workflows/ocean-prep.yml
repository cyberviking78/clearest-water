name: ocean-prep
on:
  push:
    branches: [ocean-prep]
permissions:
  contents: write
jobs:
  kd:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: ocean-prep}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q numpy
      - name: Satellite clarity in front of every piece of open coast
        run: cd pipeline/ocean && python3 kd_coast.py
      - name: Save kd.json on this branch
        run: |
          git config user.name "Clearest Water refresh"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/ocean/kd.json && git commit -q -m "Satellite clarity for the open coast" && git push -q origin HEAD:ocean-prep
