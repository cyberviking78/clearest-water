name: ocean-prep
on:
  push:
    branches: [ocean-prep]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - name: Describe the candidate Kd490 datasets
        run: |
          for d in noaacwNPPVIIRSkd490MonthlyVV00 noaacwecnNPPVIIRSSQkd490EastCoastAnnual noaacwNPPVIIRSSQkd490Monthly; do
            echo "== $d"
            curl -s -m 120 "https://coastwatch.noaa.gov/erddap/griddap/$d.das" | grep -iE "geospatial_l|time_coverage|spatial_resolution|units|_FillValue|valid_" | head -14
            curl -s -m 120 "https://coastwatch.noaa.gov/erddap/griddap/$d.dds"
          done
          echo "== search west coast"
          curl -s -m 120 "https://coastwatch.noaa.gov/erddap/search/index.csv?searchFor=kd490%20west&page=1&itemsPerPage=50" | cut -c1-300 | head -30
