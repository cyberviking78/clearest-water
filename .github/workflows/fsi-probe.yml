name: FSI springs probe
on:
  push:
    branches: [ci-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: ci}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 ci/fsi_probe.py
      - uses: actions/upload-artifact@v4
        with: {name: fsi, path: out, retention-days: 3}
